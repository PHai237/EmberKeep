<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" role="img" aria-label="Hầm ngục đá cổ, đuốc cháy và cánh cửa phát sáng">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#110f14"/><stop offset=".52" stop-color="#292330"/><stop offset="1" stop-color="#13151b"/></linearGradient>
 <radialGradient id="fire"><stop stop-color="#ffd18a" stop-opacity=".95"/><stop offset=".2" stop-color="#c77834" stop-opacity=".45"/><stop offset="1" stop-color="#c77834" stop-opacity="0"/></radialGradient>
 <radialGradient id="door"><stop stop-color="#bba779" stop-opacity=".8"/><stop offset=".4" stop-color="#668b83" stop-opacity=".36"/><stop offset="1" stop-color="#18444a" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#49414d"/><stop offset="1" stop-color="#1a1920"/></linearGradient>
 <linearGradient id="floor" x2=".25" y2="1"><stop stop-color="#39323b"/><stop offset="1" stop-color="#0c0f13"/></linearGradient>
 <linearGradient id="doorframe" x2="1" y2="0"><stop stop-color="#9d8562"/><stop offset=".6" stop-color="#363039"/><stop offset="1" stop-color="#131317"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".54" numOctaves="3" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer></filter>
 <clipPath id="clip"><rect width="1280" height="390"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="390" fill="url(#bg)"/>
<rect width="1280" height="390" fill="#292633" opacity=".25"/>
