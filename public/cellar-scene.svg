<ellipse cx="965" cy="175" rx="145" ry="144" fill="url(#fire)"/>
<g stroke="#b79b6a" stroke-width="6" stroke-linecap="round" fill="none"><path d="M309 182v45m-19-45h38M966 184v48m-17-48h35"/></g>
